services:
  sms-bridge:
    restart: unless-stopped
    build:
      context: ./sms-bridge
    environment:
      SMS_BRIDGE_PORT: ${SMS_BRIDGE_PORT:-8080}
      SMS_BRIDGE_TOKEN: ${SMS_BRIDGE_TOKEN:-}
      SMS_UPSTREAM_URL: ${SMS_UPSTREAM_URL:-}
      SMS_BUSINESS_CODE: ${SMS_BUSINESS_CODE:-}
      SMS_MESSAGE_ENUM_CODE: ${SMS_MESSAGE_ENUM_CODE:-}
      SMS_CODE_PARAM: ${SMS_CODE_PARAM:-code}
      SMS_MOBILE_AES_KEY: ${SMS_MOBILE_AES_KEY:-}
      SMS_UPSTREAM_TIMEOUT_MS: ${SMS_UPSTREAM_TIMEOUT_MS:-5000}
