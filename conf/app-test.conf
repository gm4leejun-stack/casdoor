# 测试环境模板：部署时复制或挂载为 <工作目录>/conf/app.conf。
# 不要只通过 --config 切换，Session 等配置会在参数解析前读取。
appname = casdoor
httpport = 8000
runmode = test
copyrequestbody = true

# MySQL 8.0；预先创建 utf8mb4 的 casdoor_test 数据库。
# dataSourceName 通过 runtime-test.env 的同名环境变量注入。
# 格式：casdoor_test:PASSWORD@tcp(MYSQL_HOST:3306)/，末尾保留 /，不拼库名或参数。
driverName = mysql
dataSourceName = "casdoor:4c640514d0c807f34b68e25a@tcp(192.168.224.28:3306)/"
dbName = casdoor_test
tableNamePrefix =
showSql = false

# 由环境变量 redisEndpoint 覆盖；格式：HOST:6379,100,PASSWORD,0。
# 留空时使用本地 Session/内存状态，仅适用于可接受登录状态丢失的单实例测试。
redisEndpoint =
defaultStorageProvider =
isCloudIntranet = false
authState = "casdoor_test"
socks5Proxy =
verificationCodeTimeout = 10
initScore = 0
logPostOnly = true
isUsernameLowered = false

# 必改：浏览器实际访问的协议、域名及端口；不要加结尾 / 或路径。
# 前后端同域时两项保持一致；IP 访问示例：http://192.0.2.10:18000。
origin = "http://192.168.224.26:/"
originFrontend = "https://casdoor-test.example.com"
staticBaseUrl = "https://cdn.casbin.org"
isDemoMode = false
batchSize = 100
showGithubCorner = false
forceLanguage = ""
defaultLanguage = "zh"
defaultApplication = "app-built-in"
maxItemsForFlatMenu = 7
enableErrorMask = true
enableGzip = true
inactiveTimeoutMinutes =

# 普通 Web 测试不启动 LDAP/LDAPS；有需求时再配置证书和端口。
ldapServerPort = 0
ldapsCertId = ""
ldapsServerPort = 0
# 当前实现仍启动 RADIUS；普通 Web 测试不要对外开放 UDP 1812。
# 通过环境变量 radiusSecret 注入独立强密钥，不使用时也不要保留空密钥。
radiusServerPort = 1812
radiusDefaultOrganization = "built-in"
radiusSecret =
quota = {"organization": -1, "user": -1, "application": -1, "provider": -1}
logConfig = {"adapter":"console"}

# 默认不导入数据；需要时使用脱敏的测试数据文件，并设置其容器内路径。
initDataNewOnly = true
initDataFile = ""
# 前端固定使用当前工作目录的 web/build，不依赖本机开发目录。
frontendBaseDir = ""
